<title>富士山登山立体图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-screen 3D model of the mountain at night, a glass panel on the right (bottom sheet on phones),
   route chips across the top. One deliberate dark world: the pre-dawn climb toward 御来光. */
:root{
  --sky-top:#070B16; --sky-low:#1A2340; --dawn:#F2A65A; --dawn-soft:rgba(242,166,90,.16);
  --panel:rgba(13,18,33,.88); --panel-solid:#0F1526; --ink:#E9EDF5; --mute:#97A3BC; --faint:#5E6A84;
  --line:rgba(160,180,220,.14); --chip:rgba(255,255,255,.06);
  --Y:#F2C230; --S:#E9493E; --G:#3DB36B; --F:#3E86F0; --X:#D9DEE8; --P:#B48CF2;
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--sky-top);color:var(--ink);font-family:var(--sans);overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--dawn);outline-offset:2px}
#app{position:fixed;inset:0;background:radial-gradient(120% 70% at 50% 108%,#3A2E3E 0%,#1A2340 38%,var(--sky-top) 78%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}

/* top bar */
.top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;pointer-events:none;z-index:5}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--serif);font-weight:900;font-size:clamp(20px,2.4vw,28px);letter-spacing:.04em;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.brand h1 b{color:var(--dawn);font-family:var(--mono);font-weight:700;font-size:.78em;margin-left:.3em;letter-spacing:0}
.brand span{color:var(--mute);font-size:12.5px;text-shadow:0 1px 6px #000}
.chips{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto;max-width:calc(100% - 400px)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px 6px 9px;border-radius:999px;border:1px solid var(--line);background:rgba(10,14,26,.72);backdrop-filter:blur(8px);cursor:pointer;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.chip small{color:var(--mute);font-family:var(--mono);font-size:11px}
.chip:hover{border-color:rgba(255,255,255,.3)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 22%,rgba(10,14,26,.85));border-color:var(--c)}

/* pins */
.pin{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:none;padding:0;cursor:pointer;will-change:transform}
.pin .dot{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--c);border:2px solid #0B0F1C;box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.pin.hut .dot{width:8px;height:8px;left:-4px;top:-4px;border-radius:2px;transform:rotate(45deg);background:#FFF6E6;border:1.5px solid var(--c)}
.pin.mark .dot{background:var(--dawn);border-color:#2A1A08;width:9px;height:9px;left:-4.5px;top:-4.5px}
.pin .lab{position:absolute;left:9px;top:-10px;white-space:nowrap;font-size:12px;line-height:20px;padding:0 7px;border-radius:4px;background:rgba(8,11,22,.78);border-left:2px solid var(--c);color:var(--ink);opacity:0;transition:opacity .12s}
.pin .lab em{font-style:normal;font-family:var(--mono);color:var(--mute);font-size:10.5px;margin-left:5px}
.pin.show .lab{opacity:1}
.pin.mark .lab{border-left-color:var(--dawn)}
.pin.dim{opacity:.28}
.pin.sel .dot{box-shadow:0 0 0 3px var(--dawn),0 0 18px var(--dawn)}
.pin.hidden{display:none}
#probe{position:absolute;left:0;top:0;pointer-events:none;display:none}
#probe .ring{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;border:2px solid #fff;background:var(--c);box-shadow:0 0 0 4px rgba(255,255,255,.18),0 0 22px var(--c)}
#probe .read{position:absolute;left:14px;top:-34px;white-space:nowrap;font:500 12px/1.35 var(--sans);background:rgba(8,11,22,.9);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
#probe .read b{font-family:var(--mono)}

/* info card */
#card{position:absolute;z-index:8;width:300px;max-width:calc(100vw - 32px);background:var(--panel-solid);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;box-shadow:0 18px 50px rgba(0,0,0,.55);font-size:13px;line-height:1.6}
#card h3{margin:0 24px 2px 0;font-family:var(--serif);font-size:18px;line-height:1.3}
#card .sub{color:var(--mute);font-size:12px;margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#card .x{position:absolute;right:6px;top:6px;width:28px;height:28px;border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer;border-radius:6px}
#card .x:hover{background:var(--chip)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:6px 0 8px}
.kv dt{color:var(--mute)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--chip);border:1px solid var(--line)}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.note{color:#CBD3E3;margin:0}

/* panel */
#panel{position:absolute;z-index:6;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:390px;display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;padding:12px 0 10px;border:0;background:none;cursor:pointer;color:var(--mute);font-size:14px;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--dawn)}
.grab{display:none}
.body{flex:1;overflow-y:auto;padding:16px 16px 24px;font-size:13.5px;line-height:1.7;scrollbar-width:thin}
.body h2{font-family:var(--serif);font-size:19px;margin:0 0 6px;text-wrap:balance}
.body h4{font-size:12px;letter-spacing:.12em;color:var(--mute);font-weight:500;margin:20px 0 8px;text-transform:uppercase}
.body p{margin:0 0 10px;color:#D3DAE8}
.lead{color:#D9DFEB}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;color:var(--mute);font-weight:500;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.rt{cursor:pointer}
.tbl tr.rt:hover td{background:rgba(255,255,255,.03)}
.rn{display:inline-flex;align-items:center;gap:6px;font-weight:700;white-space:nowrap}
.rn i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.025);margin:10px 0}
.box ul{margin:4px 0 0;padding-left:18px}
.box li{margin:2px 0}
.warn{border-color:rgba(242,166,90,.35);background:var(--dawn-soft)}
svg text{font-family:var(--sans)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 12px;cursor:pointer;color:var(--mute);font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.stats div{border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.stats small{display:block;color:var(--mute);font-size:11px}
.stats b{font-family:var(--mono);font-size:15px}
.seq{list-style:none;margin:6px 0 0;padding:0;position:relative}
.seq:before{content:"";position:absolute;left:46px;top:6px;bottom:6px;width:2px;background:var(--c);opacity:.5}
.seq li{display:grid;grid-template-columns:40px 14px 1fr;gap:0 6px;align-items:start;padding:3px 0}
.seq .alt{font-family:var(--mono);font-size:11.5px;color:var(--mute);text-align:right;padding-top:2px}
.seq .mk{width:12px;height:12px;border-radius:50%;margin-top:5px;background:var(--panel-solid);border:2px solid var(--c);position:relative;z-index:1}
.seq .mk.h{width:9px;height:9px;transform:rotate(45deg);border-radius:1px;margin:7px 0 0 2px;background:#FFF6E6;border-width:1.5px}
.seq button{border:0;background:none;text-align:left;padding:0;cursor:pointer;line-height:1.5}
.seq button:hover .nm{text-decoration:underline}
.seq .st{font-weight:700}
.seq .nm{color:#D9DFEB}
.seq .tm{color:var(--faint);font-size:11.5px;margin-left:4px;font-family:var(--mono)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:rgba(255,255,255,.3)}
.btn.pri{background:var(--dawn);color:#1C1208;border-color:var(--dawn);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:6px 0 10px}
.months button{border:1px solid var(--line);background:none;border-radius:6px;padding:5px 0;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--mute)}
.months button.season{color:var(--ink);border-color:rgba(242,166,90,.35)}
.months button[aria-pressed="true"]{background:var(--dawn);color:#1C1208;border-color:var(--dawn)}
.src{color:var(--faint);font-size:11.5px;line-height:1.6}
.src a{color:var(--mute)}
.layers{display:grid;gap:8px}
.layers label{display:flex;align-items:center;gap:8px;cursor:pointer}
.layers input[type=range]{flex:1;accent-color:var(--dawn)}
.hint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-size:12px;color:var(--mute);text-shadow:0 1px 4px #000;pointer-events:none;z-index:4}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:18px;color:var(--mute);z-index:20;background:var(--sky-top);transition:opacity .6s}
.loading.done{opacity:0;pointer-events:none}
.compass{position:absolute;z-index:5;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(10,14,26,.7);display:grid;place-items:center;cursor:pointer;padding:0}
.compass svg{width:34px;height:34px}


.livebadge{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(10,14,26,.72);backdrop-filter:blur(8px);border-radius:999px;padding:4px 12px 4px 8px;cursor:pointer;font-size:12.5px;color:var(--ink);align-self:flex-start}
.livebadge .pulse{width:8px;height:8px;border-radius:50%;background:#58D68D;animation:pulse 2s infinite}
.livebadge.stale .pulse{background:var(--faint);animation:none}
.livebadge b{font-family:var(--mono)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(88,214,141,.55)}70%{box-shadow:0 0 0 8px rgba(88,214,141,0)}100%{box-shadow:0 0 0 0 rgba(88,214,141,0)}}
.hero{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:8px 0 4px}
.hero .big{font-family:var(--mono);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.02em}
.hero .meta{color:var(--mute);font-size:12.5px;line-height:1.6}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--chip)}
.pill.ok{border-color:rgba(88,214,141,.45);color:#9BE3B8}
.pill.closed{border-color:rgba(242,166,90,.45);color:#F5C08E}
.pill.alert{border-color:rgba(233,73,62,.6);color:#F7A49C}
.chart{position:relative;margin:6px 0 2px}
.chart .tip{position:absolute;top:0;pointer-events:none;background:#0A0E1A;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.55;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:2}
.chart .tip i{display:inline-block;width:12px;height:2px;margin-right:6px;vertical-align:middle;background:var(--c)}
.chart .tip b{font-family:var(--mono)}
.news{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.news a{color:var(--ink);text-decoration:none;display:block;border-bottom:1px solid var(--line);padding-bottom:7px}
.news a:hover span{text-decoration:underline}
.news small{display:block;color:var(--mute);font-family:var(--mono);font-size:11px}
.stale-note{color:#F5C08E;font-size:12px}
.fj{display:grid;grid-template-columns:46px repeat(14,minmax(19px,1fr));gap:2px;font-size:11px;min-width:330px}
.fj .h{color:var(--mute);text-align:center;font-size:10.5px;line-height:1.25;padding-bottom:2px}
.fj .h.d{grid-column:span 2;color:var(--ink);font-size:11px}
.fj .side{color:var(--mute);font-size:11px;line-height:1.2;align-self:center}
.fj .c{height:26px;border-radius:4px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;color:var(--ink);background:rgba(242,166,90,var(--a));font-variant-numeric:tabular-nums}
.fj .c.lo{color:var(--mute);font-weight:500}
.fj .c.now{outline:2px solid #E9EDF5;outline-offset:-1px}
.fj .c.past{opacity:.45}
.fjnow{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 8px}
.fjnow b{font-family:var(--mono);font-size:20px;color:var(--dawn)}
@media (prefers-reduced-motion:reduce){.livebadge .pulse{animation:none}}
@media (max-width:820px){
  .chips{max-width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .brand span{display:none}
  #panel{left:0;right:0;top:auto;bottom:0;width:auto;height:46%;border-radius:14px 14px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);transition:height .25s}
  #panel.min{height:96px}
  #panel.max{height:82%}
  .grab{display:block;flex:none;height:16px;border:0;background:none;cursor:pointer;position:relative;width:100%}
  .grab:after{content:"";position:absolute;left:50%;top:6px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:rgba(255,255,255,.25)}
  .body{padding:12px max(16px,env(safe-area-inset-left,0px)) 20px max(16px,env(safe-area-inset-right,0px))}
  .hint{display:none}
  .compass{bottom:calc(46% + 12px)}
  #card{left:16px!important;right:16px;width:auto;top:auto!important;bottom:calc(46% + 10px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <canvas id="gl" aria-label="富士山三维地形图，可拖动旋转、缩放"></canvas>
  <div id="pins"></div>
  <div id="probe"><div class="ring"></div><div class="read"></div></div>

  <div class="top">
    <div class="brand"><h1>富士山<b>3776 m</b></h1><span>四条登山路线 · 合目 · 山小屋 · 海拔与气温</span></div>
    <div class="chips" id="chips" role="group" aria-label="选择路线"></div>
    <button class="livebadge" id="liveBadge" hidden></button>
  </div>

  <button class="compass" id="compass" title="回到全景" aria-label="回到全景"><svg viewBox="-20 -20 40 40"><g id="needle"><path d="M0 -15 L5 0 L-5 0Z" fill="#E9493E"/><path d="M0 15 L5 0 L-5 0Z" fill="#97A3BC"/><text x="0" y="-4" font-size="0" fill="none">N</text></g></svg></button>
  <div class="hint">拖动旋转 · 右键或双指平移 · 滚轮或双指缩放 · 点标记看详情</div>

  <section id="panel" aria-label="信息面板">
    <button class="grab" id="grab" aria-label="展开或收起面板"></button>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="all" aria-selected="true">整体</button>
      <button role="tab" data-tab="live" aria-selected="false">实况</button>
      <button role="tab" data-tab="route" aria-selected="false">路线</button>
      <button role="tab" data-tab="temp" aria-selected="false">气温</button>
      <button role="tab" data-tab="view" aria-selected="false">显示</button>
    </div>
    <div class="body" id="body"></div>
  </section>

  <div id="card" hidden></div>
  <div class="loading" id="loading">正在加载地形…</div>
</div>

function hAt(x,y){ // x east from W edge, y south from N edge (m)
  let u=x/KX*HW-.5,v=y/KY*HH-.5; u=Math.max(0,Math.min(HW-1.001,u)); v=Math.max(0,Math.min(HH-1.001,v));
  const i=Math.floor(u),j=Math.floor(v),fu=u-i,fv=v-j,a=j*HW+i;
  return HGT[a]*(1-fu)*(1-fv)+HGT[a+1]*fu*(1-fv)+HGT[a+HW]*(1-fu)*fv+HGT[a+HW+1]*fu*fv;

/* ---------------- routes ---------------- */
function profile(key){ // pts with h, cumulative distance
  const P=D.paths[key];const out=[];let d=0;
  for(let i=0;i<P.length;i++){const [x,y]=P[i],h=hAt(x,y);if(i){const [a,b]=P[i-1],ph=out[i-1].h;d+=Math.hypot(x-a,y-b,h-ph)}out.push({x,y,h,d})}
  return out;
}
const PROF={};Object.keys(D.paths).forEach(k=>PROF[k]=profile(k));
const resV=new THREE.Vector2(1,1);
const lines=[];
function mkLine(key,col,dashed,group){
  const P=PROF[key];const arr=[];P.forEach(p=>{const v=W2(p.x,p.y,p.h+9);arr.push(v.x,v.y,v.z)});
  const g=new THREE.LineGeometry();g.setPositions(arr);
  const mk=(depth,op,w)=>{const m=new THREE.LineMaterial({color:new THREE.Color(col),linewidth:w,transparent:true,opacity:op,depthTest:depth,dashed,dashSize:45,gapSize:35,resolution:resV});
    const l=new THREE.Line2(g,m);l.computeLineDistances();l.renderOrder=depth?2:1;world.add(l);return l};
  const main=mk(true,1,3.2),ghost=mk(false,.22,2);
  const o={key,group,main,ghost,dashed};lines.push(o);return o;
}
for(const [k,r] of Object.entries(ROUTES)){mkLine(r.up,r.col,false,k);if(r.down!==r.up)mkLine(r.down,r.col,true,k)}

function nearestOn(key,p){const P=PROF[key];let bi=0,bd=1e18;P.forEach((q,i)=>{const d=(q.x-p.x)**2+(q.y-p.y)**2;if(d<bd){bd=d;bi=i}});return {i:bi,d:Math.sqrt(bd),at:P[bi].d}}
function effortFrac(key,i){const P=PROF[key];let e=0,tot=0,up=0;const ef=[0];for(let k=1;k<P.length;k++){const dz=P[k].h-P[k-1].h,dd=P[k].d-P[k-1].d;const c=dd/1000+(dz>0?dz/100:Math.abs(dz)/300);tot+=c;ef.push(tot)}return ef[i]/tot}

function ladderSVG(){

  g+=`<line x1="44" x2="${w-58}" y1="${Y(3776)}" y2="${Y(3776)}" stroke="#F2A65A" stroke-dasharray="3 3"/><text x="${w-56}" y="${Y(3776)+4}" font-size="10" fill="#F2A65A">剑峰 3776</text>`;
  // treeline band
  g+=`<rect x="44" width="${w-102}" y="${Y(2500)}" height="${Y(2300)-Y(2500)}" fill="rgba(61,179,107,.08)"/><text x="${w-56}" y="${Y(2400)+4}" font-size="10" fill="#6FA884">森林线</text>`;
  g+=`<text x="${w-56}" y="${Y(3200)+4}" font-size="10" fill="#97A3BC">小屋集中</text><rect x="44" width="${w-102}" y="${Y(3450)}" height="${Y(2700)-Y(3450)}" fill="rgba(255,246,230,.035)"/>`;
  for(const k of ks){const r=ROUTES[k],x=cx(k);
    g+=`<line x1="${x}" x2="${x}" y1="${Y(r.startAlt)}" y2="${Y(3712)}" stroke="${r.col}" stroke-width="5" stroke-linecap="round"/>`;
    hutsOf(k).forEach(p=>{g+=`<rect x="${x+6}" y="${Y(p.e)-2.5}" width="5" height="5" transform="rotate(45 ${x+8.5} ${Y(p.e)})" fill="#FFF6E6" opacity=".85"/>`});
    g+=`<circle cx="${x}" cy="${Y(r.startAlt)}" r="5" fill="#0F1526" stroke="${r.col}" stroke-width="2"/><text x="${x}" y="${Y(r.startAlt)+17}" text-anchor="middle" font-size="10.5" fill="#E9EDF5" font-family="JetBrains Mono">${r.startAlt}</text>`;
    g+=`<text x="${x}" y="${bot+20}" text-anchor="middle" font-size="11.5" fill="${r.col}" font-weight="700">${r.name.replace('路线','')}</text>`;
  }

}

const CH={};
function fcChart(kind){
  const i0=fcIdx();const ids=kind==='temp'?['summit','F','Y','S','G']:['summit'];
  const series=ids.map(id=>{const f=LIVE.fc?.find(x=>x.id===id);return f?{id,name:FCSHORT[id],col:FCCOL[id],pts:f.s.slice(i0,i0+49).map(r=>({t:Date.parse(r[0]+':00:00Z'),v:kind==='temp'?r[1]:r[2],r}))}:null}).filter(Boolean);
  if(!series.length)return '';
  const W=358,H=kind==='temp'?190:120,L=30,R=kind==='temp'?50:14,T=10,B=22;
  const t0=series[0].pts[0].t,t1=series[0].pts[series[0].pts.length-1].t;
  let vmin=Math.min(...series.flatMap(s=>s.pts.map(p=>p.v))),vmax=Math.max(...series.flatMap(s=>s.pts.map(p=>p.v)));
  const step=kind==='temp'?5:5;vmin=kind==='wind'?0:Math.floor(vmin/step)*step;vmax=Math.ceil((vmax+.01)/step)*step;
  const X=t=>L+(t-t0)/(t1-t0)*(W-L-R),Y=v=>H-B-(v-vmin)/(vmax-vmin)*(H-T-B);
  let g='';
  for(let v=vmin;v<=vmax;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(160,180,220,${v===0&&kind==='temp'?.35:.12})"/><text x="${L-4}" y="${Y(v)+3.5}" text-anchor="end" font-size="9.5" fill="#97A3BC" font-family="JetBrains Mono">${v}</text>`}
  // x ticks at JST 00/06/12/18
  for(let t=Math.ceil(t0/3600e3)*3600e3;t<=t1;t+=3600e3){const hj=(new Date(t).getUTCHours()+9)%24;if(hj%6)continue;const x=X(t);
    const lab=hj===0?new Date(t).toLocaleDateString('zh-CN',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric'}):String(hj).padStart(2,'0')+'时';
    g+=`<line x1="${x}" x2="${x}" y1="${T}" y2="${H-B}" stroke="rgba(160,180,220,${hj===0?.22:.07})"/><text x="${x}" y="${H-7}" text-anchor="middle" font-size="9.5" fill="${hj===0?'#E9EDF5':'#97A3BC'}" font-family="JetBrains Mono">${lab}</text>`}
  if(kind==='wind'){const s=series[0];let a=`M${X(s.pts[0].t)} ${Y(0)}`;s.pts.forEach(p=>a+=`L${X(p.t).toFixed(1)} ${Y(p.v).toFixed(1)}`);a+=`L${X(t1)} ${Y(0)}Z`;g+=`<path d="${a}" fill="rgba(233,237,245,.10)"/>`}
  series.forEach(s=>{let d='';s.pts.forEach((p,k)=>d+=(k?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.v).toFixed(1));g+=`<path d="${d}" fill="none" stroke="${s.col}" stroke-width="${s.id==='summit'?2.4:2}" stroke-linejoin="round"/>`});
  if(kind==='temp'){ // direct labels, nudged apart
    const labs=series.map(s=>({s,y:Y(s.pts[s.pts.length-1].v)})).sort((a,b)=>a.y-b.y);
    for(let it=0;it<20;it++)for(let k=1;k<labs.length;k++){const dy=labs[k].y-labs[k-1].y;if(dy<12){labs[k].y+=(12-dy)/2;labs[k-1].y-=(12-dy)/2}}
    labs.forEach(l=>g+=`<text x="${W-R+5}" y="${l.y+3.5}" font-size="10.5" fill="#D3DAE8">${l.s.name}</text>`);
  }
  g+=`<line class="cx" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="#fff" stroke-opacity="0"/>`;
  series.forEach(s=>g+=`<circle class="cd" data-id="${s.id}" r="3.5" fill="${s.col}" stroke="#0F1526" stroke-width="2" opacity="0"/>`);
  CH[kind]={series,X,Y,W,L,R,t0,t1};
  const unit=kind==='temp'?'℃':'m/s';
  return `<div class="chart" data-kind="${kind}"><svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;touch-action:pan-y" role="img" aria-label="${kind==='temp'?'未来48小时各海拔气温预报':'未来48小时山顶风速预报'}">${g}</svg><div class="tip" hidden></div></div>
  ${kind==='temp'?`<div class="row" style="gap:12px;font-size:12px;color:var(--mute)">${series.map(s=>`<span class="rn" style="--c:${s.col};font-weight:400"><i></i>${s.name} ${LIVE.fc.find(f=>f.id===s.id).alt} m</span>`).join('')}</div>`:''}
  <p class="src" style="margin:2px 0 0">单位：${unit}。横轴是日本时间，手指或鼠标在图上滑动看具体数值。</p>`;
}
function bindChart(el){

    const pts=c.series[0].pts;let k=0,bd=1e18;pts.forEach((p,j)=>{const d=Math.abs(p.t-t);if(d<bd){bd=d;k=j}});

    c.series.forEach(s=>{const cd=svg.querySelector(`.cd[data-id="${s.id}"]`);const p=s.pts[k];if(!p)return;cd.setAttribute('cx',c.X(p.t));cd.setAttribute('cy',c.Y(p.v));cd.setAttribute('opacity',1)});

  <dl class="kv"><dt>海拔</dt><dd>${altLine}</dd><dt>${m} 月常年</dt><dd>白天约 <span class="num">${fmtT(T(a,m,1))}</span> · 清晨约 <span class="num">${fmtT(T(a,m,2))}</span></dd>
  ${liveRow(a)}<dt>到山顶</dt><dd>还要爬 <span class="num">${Math.max(0,Math.round((3776-a)/10)*10)} m</span></dd></dl>
  ${p.t?`<p class="note">${p.t}</p>`:''}${p.k==='hut'?'<p class="src" style="margin:6px 0 0">山小屋要提前预约，只在登山季营业。</p>':''}`;
  card.hidden=false;card.querySelector('.x').onclick=closeCard;placeCard();
  pins.forEach((o,j)=>o.el.classList.toggle('sel',j===i));
}
function closeCard(){card.hidden=true;st.sel=null;pins.forEach(o=>o.el.classList.remove('sel'))}
function placeCard(){
  if(card.hidden||st.sel==null||innerWidth<=820)return;const o=pins[st.sel];if(!o.sx&&o.sx!==0)return;
  const pw=innerWidth-410;let x=o.sx+16,y=o.sy-30;if(x+310>pw)x=o.sx-316;x=Math.max(16,x);y=Math.max(90,Math.min(innerHeight-card.offsetHeight-16,y));
  card.style.left=x+'px';card.style.top=y+'px';
}
canvas.addEventListener('click',()=>{if(!dragMoved)closeCard()});
let dragMoved=false,pd=null;canvas.addEventListener('pointerdown',e=>{pd=[e.clientX,e.clientY];dragMoved=false;if(fly)fly=null});
canvas.addEventListener('pointermove',e=>{if(pd&&Math.hypot(e.clientX-pd[0],e.clientY-pd[1])>5)dragMoved=true});
document.getElementById('compass').onclick=()=>{stopPlay();flyHome()};
addEventListener('keydown',e=>{if(e.key==='Escape')closeCard()});

/* ---------------- per-frame pin layout ---------------- */
const tmpV=new THREE.Vector3();
function occluded(wp){ // march along the ray from camera to point over the heightfield
  const c=camera.position;const n=48;
  for(let s=1;s<n-2;s++){const t=s/n;const x=c.x+(wp.x-c.x)*t,y=c.y+(wp.y-c.y)*t,z=c.z+(wp.z-c.z)*t;
    const lx=x+KX/2,ly=z+KY/2;if(lx<0||ly<0||lx>KX||ly>KY)continue;if(hAt(lx,ly)*st.exag>y+4)return true}
  return false;
}
let frame=0;
function layoutPins(){
  const w=canvas.clientWidth,h=canvas.clientHeight;const camD=camera.position.distanceTo(controls.target);
  const panelLeft=innerWidth>820?innerWidth-410:innerWidth;const panelTop=innerWidth>820?innerHeight:innerHeight*(panel.classList.contains('min')?1:.54);
  const recheck=frame%4===0;
  const cand=[];
  pins.forEach((o,i)=>{const p=o.p;
    let vis=true;if(p.k==='hut'&&!st.showHuts)vis=false;
    const inRoute=st.route===null||p.r.includes(st.route)||p.k==='mark';
    const wp=W2(p.x,p.y,p.de*st.exag+6);const dist=camera.position.distanceTo(wp);
    tmpV.copy(wp).project(camera);
    if(tmpV.z>1||Math.abs(tmpV.x)>1.1||Math.abs(tmpV.y)>1.1)vis=false;
    if(p.k==='hut'&&dist>16000&&st.route===null)vis=false;
    if(recheck&&vis)o.occ=occluded(wp);
    if(!vis||o.occ){o.el.classList.add('hidden');o.sx=null;return}
    const sx=(tmpV.x+1)/2*w,sy=(1-tmpV.y)/2*h;o.sx=sx;o.sy=sy;
    o.el.classList.remove('hidden');o.el.style.transform=`translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px)`;
    o.el.classList.toggle('dim',!inRoute);
    let want=st.showLabels&&inRoute;
    if(p.k==='hut')want=want&&(dist<5200||(st.route&&dist<9000));
    if(i===hoverPin||i===st.sel)want=true;
    if(sx>panelLeft-10||sy>panelTop)want=want&&(i===st.sel);
    let pr=o.prio+(st.route&&p.r.includes(st.route)?3:0)+(i===hoverPin||i===st.sel?10:0)-dist/1e6;
    cand.push({o,sx,sy,want,pr});
  });
  cand.sort((a,b)=>b.pr-a.pr);const boxes=[];
  for(const c of cand){let show=false;
    if(c.want){if(!c.o.w)c.o.w=c.o.el.querySelector('.lab').offsetWidth||80;
      const b=[c.sx+6,c.sy-11,c.sx+12+c.o.w,c.sy+10];
      show=!boxes.some(q=>b[0]<q[2]&&b[2]>q[0]&&b[1]<q[3]&&b[3]>q[1]);if(show)boxes.push(b)}
    c.o.el.classList.toggle('show',show);
  }
  if(probeW){tmpV.copy(probeW);tmpV.y*=st.exag;tmpV.project(camera);probe.style.transform=`translate(${((tmpV.x+1)/2*w).toFixed(1)}px,${((1-tmpV.y)/2*h).toFixed(1)}px)`}
}

/* ---------------- loop ---------------- */
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  // keep the mountain centred in the free area beside the panel on desktop
  if(innerWidth>820){camera.setViewOffset(w,h,195,0,w,h)}else{camera.setViewOffset(w,h,0,h*.2,w,h)}
  camera.updateProjectionMatrix();resV.set(w*renderer.getPixelRatio(),h*renderer.getPixelRatio());lines.forEach(l=>{l.main.material.resolution.copy(resV);l.ghost.material.resolution.copy(resV)})}
addEventListener('resize',resize);resize();
const needle=document.getElementById('needle');
function loop(now){
  requestAnimationFrame(loop);frame++;
  if(fly){let t=(now-fly.t0)/fly.dur;if(t>=1){t=1}const e=ease(t);camera.position.lerpVectors(fly.fp,fly.tp,e);controls.target.lerpVectors(fly.ft,fly.tt,e);if(t>=1)fly=null}
  stepPlay(now);
  controls.update();
  renderer.render(scene,camera);
  layoutPins();placeCard();
  needle.setAttribute('transform',`rotate(${(-camAz()*180/Math.PI+180).toFixed(1)})`);
}
renderChips();styleLines();renderPanel();initLive();
requestAnimationFrame(loop);
document.getElementById('loading').classList.add('done');
window.__fuji={st,selectRoute,flyTo,view,openCard,camera,controls};
})().catch(err=>{document.getElementById('loading').textContent='加载失败：'+err.message;console.error(err)});
