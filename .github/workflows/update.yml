name: 更新富士山实况

on:
  schedule:
    - cron: "0 3 * * *"   # 每天日本时间 12:00（UTC 3:00；GitHub 高峰期可能晚几分钟到半小时）
  workflow_dispatch:       # 网页上的「立即更新」按钮也走这里
  push:
    branches: [main]
    paths: ["site/**", "build/make_public.py", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fuji-live
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: 抓取数据
        run: python3 fetch.py /tmp/live.json

      - name: 写到 data 分支（给 Claude 里的网页读；只保留最新一份）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/out && cp /tmp/live.json /tmp/out/live.json
          cd /tmp/out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add live.json
          git commit -q -m "实况数据 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: 打包公开网页
        run: python3 build/make_public.py _site /tmp/live.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
