name: 更新富士山实况

on:
  schedule:
    - cron: "0 3 * * *"   # 每天日本时间 12:00（UTC 3:00；GitHub 高峰期可能晚几分钟到半小时）
  workflow_dispatch:         # 网页上的「立即更新」按钮也走这里

permissions:
  contents: write

concurrency:
  group: fuji-live
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 抓取数据
        run: python3 fetch.py /tmp/live.json
      - name: 写到 data 分支（只保留最新一份，仓库不会越来越大）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/out && cp /tmp/live.json /tmp/out/live.json
          cd /tmp/out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add live.json
          git commit -q -m "实况数据 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
